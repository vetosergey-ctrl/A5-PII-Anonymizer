name: Build installer

on:
  workflow_dispatch:
  push:
    branches: [ feature/multilingual-pii-redesign ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest   # x64 runner
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Engine has zero runtime deps; tests run without npm install.
      - name: Engine tests (node:test)
        run: node --test test/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      # tools/setup-x64.ps1: export WikiNeural -> ONNX (quantized), flip model id,
      # npm install, ensure libvips DLLs, electron-builder --win.
      - name: Export model + build installer
        shell: pwsh
        run: ./tools/setup-x64.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: A5-PII-Anonymizer-setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
